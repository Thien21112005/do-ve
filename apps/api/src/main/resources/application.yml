spring:
  application:
    name: dove-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

dove:
  timezone: Asia/Ho_Chi_Minh
  admin:
    api-key: "${DOVE_ADMIN_API_KEY:dove-admin-secret-key}"
  scheduler:
    cron: "${DOVE_SCHEDULER_CRON:0 */5 16-17 * * *}"
    zone: "${DOVE_SCHEDULER_ZONE:Asia/Ho_Chi_Minh}"
    window-start: "${DOVE_SCHEDULER_WINDOW_START:16:10}"
    window-end: "${DOVE_SCHEDULER_WINDOW_END:17:30}"
  ingestion:
    user-agent: "${DOVE_INGESTION_USER_AGENT:DoVe-Bot/1.0 (+https://github.com/thien211105/DoVe; contact@dove.app)}"
    rate-limit-interval-ms: ${DOVE_INGESTION_RATE_LIMIT_MS:2000}
    connect-timeout-ms: ${DOVE_INGESTION_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${DOVE_INGESTION_READ_TIMEOUT_MS:10000}
    xskt:
      base-url: "${DOVE_XSKT_BASE_URL:https://xskt.com.vn}"
  app:
    min-supported-version: "${DOVE_APP_MIN_SUPPORTED_VERSION:1.0.0}"
    maintenance: ${DOVE_APP_MAINTENANCE:false}
    message: "${DOVE_APP_MESSAGE:}"
  rate-limit:
    check-per-minute: ${DOVE_RATE_LIMIT_CHECK_PER_MINUTE:60}
