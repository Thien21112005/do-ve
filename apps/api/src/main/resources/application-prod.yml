spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
  flyway:
    enabled: true

server:
  forward-headers-strategy: native

logging:
  structured:
    format:
      console: ecs

management:
  endpoint:
    health:
      show-details: never

dove:
  admin:
    api-key: ${DOVE_ADMIN_API_KEY}

