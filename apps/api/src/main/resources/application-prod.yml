spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
  flyway:
    enabled: true

server:
  forward-headers-strategy: native

logging:
  structured:
    format:
      console: ecs

management:
  endpoint:
    health:
      show-details: never

dove:
  admin:
    api-key: ${DOVE_ADMIN_API_KEY}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

