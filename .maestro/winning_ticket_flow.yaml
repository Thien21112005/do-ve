appId: com.dove.app
---
- launchApp:
    clearState: true

# 1. Xác nhận màn hình Dò vé số hiển thị ngữ cảnh kỳ quay
- assertVisible: "Dò vé"
- assertVisible: "Kỳ mở thưởng"

# 2. Nhập số vé trúng thưởng (dãy 6 chữ số bảo toàn số 0 đầu)
- tapOn:
    id: "ticket-input-digit-0"
- inputText: "012345"

# 3. Bấm nút dò vé
- tapOn:
    id: "check-ticket-button"

# 4. Kiểm tra thẻ kết quả trúng thưởng hiển thị
- extendedWaitUntil:
    visible:
      id: "result-card"
    timeout: 10000

- assertVisible:
    id: "result-card-status-title"

# 5. Lưu vé vào kho lưu trữ thiết bị
- tapOn:
    id: "result-card-save-btn"
