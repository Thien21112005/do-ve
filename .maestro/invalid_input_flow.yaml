appId: com.dove.app
---
- launchApp:
    clearState: true

# 1. Khởi động màn hình Dò vé
- assertVisible: "Dò vé"

# 2. Nhập số vé chưa đủ 6 chữ số (ví dụ: 123)
- tapOn:
    id: "ticket-input-digit-0"
- inputText: "123"

# 3. Nút dò vé ở trạng thái disabled hiển thị thông báo validation
- assertVisible: "Số vé phải có đủ 6 chữ số (hiện có 3/6)"

# 4. Thẻ kết quả tuyệt đối không được hiển thị khi input không hợp lệ
- assertNotVisible:
    id: "result-card"
