services:
  postgres:
    image: postgres:16-alpine
    container_name: dove-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dove
      POSTGRES_USER: dove
      POSTGRES_PASSWORD: dove
    ports:
      - "5432:5432"
    volumes:
      - dove_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dove -d dove"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dove_pgdata:

